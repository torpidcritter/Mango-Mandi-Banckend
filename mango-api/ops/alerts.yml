# Prometheus alert rules for mango-api. Scrape GET /metrics on every instance
# (protect it with METRICS_TOKEN) and route these to the on-call phone.
groups:
  - name: mango-api
    rules:
      - alert: MaintenanceLoopStopped
        # No instance has finished a maintenance tick for 5 minutes: payments,
        # refunds, WhatsApp updates and hold releases are all waiting.
        expr: time() - max(mango_maintenance_last_run_timestamp_seconds) > 300
        for: 2m
        labels: { severity: page }
        annotations:
          summary: The mango-api background loop has not run for 5 minutes

      - alert: MaintenanceStepFailing
        expr: increase(mango_maintenance_errors_total[15m]) > 3
        labels: { severity: page }
        annotations:
          summary: 'Maintenance step {{ $labels.step }} keeps failing'

      - alert: WhatsAppMessagesFailing
        expr: increase(mango_notifications_failed_total[1h]) > 5
        labels: { severity: warn }
        annotations:
          summary: 'WhatsApp {{ $labels.kind }} messages are being given up on (check templates and the token)'

      - alert: WebhooksFailing
        expr: increase(mango_webhook_errors_total[15m]) > 3
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.source }} webhooks are failing; the sender is retrying'

      - alert: LoginCodesOnFallback
        # SMS (Jio) is failing and codes are going by WhatsApp instead.
        expr: increase(mango_otp_fallbacks_total[30m]) > 10
        labels: { severity: warn }
        annotations:
          summary: 'Login codes are falling back to {{ $labels.channel }}'

      - alert: LedgerDrift
        expr: mango_ledger_drift_lines > 0
        labels: { severity: page }
        annotations:
          summary: Stock counters disagree with the ledger; stop and investigate before selling more

      - alert: ApiErrors
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) > 0.2
        for: 5m
        labels: { severity: page }
        annotations:
          summary: mango-api is returning server errors
