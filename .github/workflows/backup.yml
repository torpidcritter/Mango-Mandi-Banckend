# Nightly encrypted copy of the production database, kept outside Neon: in this
# repository's GitHub Actions artifact storage (Actions > Backup > a run > Artifacts),
# on GitHub's servers, apart from Neon and Vercel.
# Neon's own history covers its restore window (1 day by default on paid
# plans; deploy/VERCEL.md step 1.5 raises it to 7); this covers Neon itself
# being unavailable, or a mistake noticed after the history window.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL     Neon main, direct (no -pooler) connection, read-only role
#   BACKUP_GPG_PUBLIC_KEY   an ASCII-armoured GPG public key; keep the private key offline
# Without them the job fails (BACKUP_DISABLED=true as a repository variable
# skips it on purpose). Each dump is kept 30 days as a workflow
# artifact. Decrypt with: gpg --decrypt mango-....dump.gpg > mango.dump
#
# OPS-23: a third secret makes the app notice a missed backup:
#   BACKUP_HEARTBEAT_DATABASE_URL  Neon main, logged in as a role that can only
#                                  write the 'backup' heartbeat (grants in
#                                  mango-api/ops/backup-heartbeat.sh)
# The last step records the outcome; with BACKUP_HEARTBEAT_EXPECTED=true on
# the API, Needs attention and Sentry warn after 26 hours without a backup,
# including when GitHub stops running this schedule (it pauses scheduled
# workflows in a repository with no activity for 60 days).
name: Backup

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
      HEARTBEAT_DATABASE_URL: ${{ secrets.BACKUP_HEARTBEAT_DATABASE_URL }}
    steps:
      # A missing secret fails the run (red in Actions, an email to the repo
      # owner): a green run must mean a backup was taken. A fork or a copy
      # with no production database sets the repository variable
      # BACKUP_DISABLED=true to skip it on purpose.
      - name: Check the backup is set up
        id: check
        env:
          BACKUP_DISABLED: ${{ vars.BACKUP_DISABLED }}
        run: |
          if [ "$BACKUP_DISABLED" = "true" ]; then
            echo "::notice::Backups are turned off (repository variable BACKUP_DISABLED=true)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_GPG_PUBLIC_KEY" ]; then
            echo "::error::No backup taken: set the BACKUP_DATABASE_URL and BACKUP_GPG_PUBLIC_KEY secrets, or set the repository variable BACKUP_DISABLED=true."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - name: Install pg_dump 17
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "$BACKUP_GPG_PUBLIC_KEY" | gpg --batch --import
          recipient=$(gpg --list-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          PATH="/usr/lib/postgresql/17/bin:$PATH" DATABASE_URL="$BACKUP_DATABASE_URL" BACKUP_DIR=backups \
            BACKUP_GPG_RECIPIENT="$recipient" ./mango-api/ops/backup.sh
          ls backups/*.gpg >/dev/null # never upload an unencrypted dump
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.ready == 'true'
        with:
          name: mango-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error
      # Last: tell the app a backup was taken, so it can warn when they stop.
      - name: Record the backup in the app
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "$HEARTBEAT_DATABASE_URL" ]; then
            echo "::warning::Backup taken but not recorded in the app: set the BACKUP_HEARTBEAT_DATABASE_URL secret (see mango-api/ops/backup-heartbeat.sh)."
            exit 0
          fi
          ./mango-api/ops/backup-heartbeat.sh ok
      - name: Record the failed backup in the app
        if: failure() && steps.check.outputs.ready == 'true' && env.HEARTBEAT_DATABASE_URL != ''
        run: ./mango-api/ops/backup-heartbeat.sh error "backup failed in the GitHub backup workflow"
