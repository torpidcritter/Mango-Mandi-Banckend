name: CI

on:
  push:
    branches: [main]
  pull_request:

# PLT-16: the jobs only read the code; a step that tried to push or comment is refused.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # SEC-12: no high or critical advisory in what the shop and panel ship.
      - name: Dependency audit (shipped packages)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Lint (panel, shop and the API; eslint.config.mjs)
        run: npm run lint
      - name: Unit tests (the API clients)
        run: npm run test:unit
      - run: npm run build
      - name: Build the customer app
        run: npm run shop:build
        env:
          # A made-up number for the build check only; production sets the shop's real one.
          VITE_SUPPORT_WHATSAPP: '910000000000'
      # Bundle safety: no secrets, dev routes, demo accounts or mock providers in
      # what ships to browsers (scripts/scan-bundle.mjs; the Vercel builds run it
      # too, with --forbid-localhost, so a build without VITE_API_URL fails).
      - name: Scan the built shop and panel
        run: npm run scan:bundle
      - run: npx playwright install --with-deps chromium
      # Every panel spec. They mock the API, except day-in-the-life, which
      # skips here (no E2E_EMAIL) and runs against the real API in the e2e job.
      - name: Panel specs (mocked API)
        run: npx playwright test
        env:
          CI: 'true'
      # NFR-15: Safari on an iPhone. PW_WEBKIT=1 adds the iphone project (WebKit,
      # devices['iPhone 13']) to the config; every panel spec runs on it once more.
      - run: npx playwright install --with-deps webkit
      - name: Panel specs on an iPhone (WebKit, mocked API)
        run: npx playwright test --project=iphone
        env:
          CI: 'true'
          PW_WEBKIT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mango-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: mango
          POSTGRES_DB: mango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mango" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mango-api/package-lock.json
      - run: npm ci
      # The warehouse label tests render each PDF (pdftoppm) and decode every QR on it.
      - name: Install the PDF renderer for label tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Dependency audit (API packages)
        run: npm audit --omit=dev --audit-level=high
      - name: API tests (engine, flows, concurrency)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://mango:mango@localhost:5432/mango_test
      # Neon puts PgBouncer in transaction mode in front of the database. Run the
      # whole suite (the concurrency races included) through the same kind of
      # pooler, so stock locking is proven to hold there before it ships.
      - name: Start PgBouncer in transaction mode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          # The package starts its own PgBouncer on 6432; ours runs on 6543.
          sudo systemctl stop pgbouncer || true
          echo "127.0.0.1 db-pooler.local" | sudo tee -a /etc/hosts
          mkdir -p /tmp/pgb
          printf '"mango" "mango"\n' > /tmp/pgb/users.txt
          cat > /tmp/pgb/pgbouncer.ini <<'INI'
          [databases]
          mango_test = host=127.0.0.1 port=5432 dbname=mango_test user=mango password=mango
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6543
          auth_type = trust
          auth_file = /tmp/pgb/users.txt
          pool_mode = transaction
          max_client_conn = 500
          default_pool_size = 20
          ignore_startup_parameters = extra_float_digits
          logfile = /tmp/pgb/pgb.log
          pidfile = /tmp/pgb/pgb.pid
          INI
          pgbouncer -d /tmp/pgb/pgbouncer.ini
          sleep 1
          PGPASSWORD=mango psql -h db-pooler.local -p 6543 -U mango -d mango_test -c 'select 1' > /dev/null
      - name: API tests through the pooler (as on Neon)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://mango:mango@db-pooler.local:6543/mango_test
          DATABASE_URL_UNPOOLED: postgres://mango:mango@localhost:5432/mango_test

  # OPS-12: a deploy migrates first, and a rollback keeps the new schema, so
  # the previous release must still pass its own tests on the new tables.
  previous-release-on-new-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: mango
          POSTGRES_DB: mango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mango" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The old release's bill, gift and label tests read their PDFs with poppler too.
      - name: Install the PDF renderer for the old release's PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Old API's tests on the new migrations
        working-directory: mango-api
        run: ./scripts/n-minus-1.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
        env:
          TEST_DATABASE_URL: postgres://mango:mango@localhost:5432/mango_test

  e2e:
    runs-on: ubuntu-latest
    needs: [build-and-test, api, previous-release-on-new-schema]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: mango
          POSTGRES_DB: mango
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mango" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mango-api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mango-api
      - name: Start mango-api with demo data
        working-directory: mango-api
        run: |
          # A throwaway VAPID key pair for this run only (browser notifications use the log provider).
          eval "$(node scripts/vapid-keys.mjs | sed 's/^/export /')"
          # Customer care (docs/care.md): a season that ends 90 days from today, so the subscription specs run.
          export SUBSCRIPTION_SEASON_END="$(date -u -d '+90 days' +%F)"
          nohup node src/index.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ready; then
              # Every spec books from the same few days, so the demo's 40 boxes per delivery time run out partway
              # through the suite; give this throwaway database room. A full time (SLOT_FULL) is covered by the
              # API tests, and customer-app/tests/checkout.ts still handles one if it happens.
              psql postgres://mango:mango@localhost:5432/mango -qc 'UPDATE delivery_slots SET max_boxes = 1000 WHERE max_boxes IS NOT NULL'
              exit 0
            fi
            sleep 1
          done
          cat ../api.log; exit 1
        env:
          NODE_ENV: development
          COOKIE_SECURE: 'false'
          ENABLE_DEV_ROUTES: 'true'
          LOG_LEVEL: warn
          # App feel (docs/app-feel.md), on so customer-app/tests/app-feel.spec.ts runs; every other spec runs with them on too.
          WEB_PUSH: 'true'
          WEB_PUSH_PROVIDER: log
          VAPID_SUBJECT: mailto:ops@mandimangoes.test
          LIVE_TRACKING: 'true'
          FAVOURITES: 'true'
          SHOP_INSTALL: 'true'
          SHOP_SORT_FILTER: 'true'
          # Customer care (docs/care.md), on so customer-app/tests/care.spec.ts runs.
          HELP_CENTRE: 'true'
          SUBSCRIPTIONS: 'true'
          # Growth (docs/growth.md) and gifting to many (docs/gifting.md), on so growth.spec.ts and gifting.spec.ts run.
          REFERRALS: 'true'
          FUNNEL_ANALYTICS: 'true'
          MULTI_GIFT: 'true'
          # One runner plays every customer of every spec from one address, so the per-address limits are raised
          # for this job only (the defaults are checked in mango-api/test/ops-platform.test.js).
          API_RATE_LIMIT: '20000'
          OTP_IP_LIMIT: '2000'
          # Specs reuse a customer across quick quote and confirm retries; the default (20 a minute) is checked in
          # mango-api/test/security-readiness.test.js.
          CUSTOMER_ACTION_LIMIT: '600'
          # The shop in Hindi and Kannada (docs/languages.md), on so customer-app/tests/languages.spec.ts runs.
          SHOP_LANGUAGES: 'true'
      - run: npx playwright install --with-deps chromium
      - name: PDF text tool for the bill checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Day in the life, and the panel mock's contract, against the real API
        run: npx playwright test tests/contract.spec.ts tests/day-in-the-life.spec.ts
        env:
          CI: 'true'
          VITE_API_URL: http://localhost:3000
          E2E_EMAIL: manager@mandimangoes.test
          E2E_PASSWORD: manager123
      - name: Customer app journey against the real API
        working-directory: customer-app
        run: npx playwright test
        env:
          CI: 'true'
          VITE_API_URL: http://localhost:3000
      # NFR-15: the whole shop again on Safari on an iPhone (WebKit), after the Chromium run so the
      # specs' one-per-project customers and boxes never meet a run going side by side.
      - run: npx playwright install --with-deps webkit
      # The Chromium run has used up much of the demo stock for the next few days; top it up on this
      # throwaway database so the iPhone run books the same boxes. Running short (STOCK_INSUFFICIENT) is
      # covered by the API tests.
      - run: psql postgres://mango:mango@localhost:5432/mango -qc 'UPDATE batch_lines SET on_hand = on_hand + 500'
      - name: Customer app journey on an iPhone (WebKit) against the real API
        working-directory: customer-app
        run: npx playwright test --project=iphone
        env:
          CI: 'true'
          PW_WEBKIT: '1'
          VITE_API_URL: http://localhost:3000
      # What each failing page showed (its accessibility snapshot), since this job keeps no report.
      - if: failure()
        run: for f in $(find test-results-shop -name error-context.md 2>/dev/null); do echo "== $f"; head -80 "$f"; done
      - if: failure()
        run: cat api.log

  production-images:
    # Builds the production images and checks the server config, so a broken
    # Dockerfile or Caddyfile shows up here rather than on deploy day.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      SHOP_DOMAIN: example.in
      ADMIN_DOMAIN: admin.example.in
      API_DOMAIN: api.example.in
      ACME_EMAIL: ops@example.in
      POSTGRES_PASSWORD: ci-only
      # A made-up help number for the image build check; production sets the real one in deploy/.env.
      VITE_SUPPORT_WHATSAPP: '910000000000'
    steps:
      - uses: actions/checkout@v7
      - run: touch .env
      - name: Compose file is valid
        run: docker compose -f compose.yml config -q
      - name: Caddyfile is valid
        run: >-
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e SHOP_DOMAIN -e ADMIN_DOMAIN -e API_DOMAIN -e ACME_EMAIL
          caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build the API and web images
        run: docker compose -f compose.yml build api web
